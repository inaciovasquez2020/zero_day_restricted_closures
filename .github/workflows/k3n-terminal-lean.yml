name: k3n-terminal-lean

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: compile-k3n-terminal-reduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Compile terminal conditional reduction
        shell: bash
        run: |
          lean -o core/intended_unrestricted_state_closure.olean \
            core/intended_unrestricted_state_closure.lean
          LEAN_PATH=. lean lean/Chronos/Frontier/K3nTerminalClosureReduction.lean

      - name: Reject unsound placeholders in terminal reduction
        shell: bash
        run: |
          if grep -nE '\b(axiom|opaque|sorry|admit)\b' lean/Chronos/Frontier/K3nTerminalClosureReduction.lean; then
            echo "Unsound placeholder token found in terminal reduction"
            exit 1
          fi
